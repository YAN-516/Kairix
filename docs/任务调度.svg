<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">Kairix per-CPU MLFQ 调度策略</title>
  <desc id="desc">展示 Processor、每 CPU TaskManager、实时队列、四级 MLFQ，以及任务唤醒和入队选核流程。</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#2563eb" stroke-width="1.8"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#15803d" stroke-width="1.8"/>
    </marker>
    <marker id="gray-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#475569" stroke-width="1.8"/>
    </marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#172033}
      .page{fill:#fff}.panel{fill:#fbfcfe;stroke:#cbd5e1;stroke-width:2}
      .title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#64748b}
      .panel-title{font-size:17px;font-weight:700}.label{font-size:14px;font-weight:700}
      .small{font-size:12px;font-weight:600}.tiny{font-size:11px;fill:#475569}
      .box{stroke:#334155;stroke-width:1.35}.processor{fill:#dcfce7}.task{fill:#fff7ed}
      .context{fill:#e0f2fe}.rt{fill:#fee2e2}.l0{fill:#dcfce7}.l1{fill:#e8f5e9}
      .l2{fill:#f0fdf4}.l3{fill:#f7fee7}.wait{fill:#fff1f2}.balance{fill:#eff6ff}
      .other{fill:#f1f5f9}.note{fill:#fffbeb;stroke:#d97706;stroke-width:1.2}
      .blue{fill:none;stroke:#2563eb;stroke-width:2.1;marker-end:url(#blue-arrow)}
      .green{fill:none;stroke:#15803d;stroke-width:2.1;marker-end:url(#green-arrow)}
      .gray{fill:none;stroke:#475569;stroke-width:1.7;stroke-dasharray:6 5;marker-end:url(#gray-arrow)}
    </style>
  </defs>

  <rect class="page" width="1280" height="600"/>
  <text class="title" x="640" y="36" text-anchor="middle">Kairix per-CPU MLFQ 调度策略</text>
  <text class="subtitle" x="640" y="59" text-anchor="middle">实时队列 · 四级多级反馈队列 · 唤醒与入队选核</text>

  <!-- CPU and task context -->
  <rect class="panel" x="30" y="82" width="300" height="485" rx="13"/>
  <text class="panel-title" x="180" y="112" text-anchor="middle">CPU 0 / Processor[0]</text>
  <rect class="box processor" x="60" y="140" width="240" height="92" rx="8"/>
  <text class="label" x="180" y="166" text-anchor="middle">Processor</text>
  <rect class="box" x="78" y="184" width="96" height="32" rx="5" fill="#bfdbfe"/>
  <text class="small" x="126" y="205" text-anchor="middle">current = T1</text>
  <rect class="box" x="186" y="184" width="96" height="32" rx="5" fill="#d9f99d"/>
  <text class="small" x="234" y="205" text-anchor="middle">idle_task_cx</text>

  <rect class="box task" x="60" y="285" width="240" height="235" rx="8"/>
  <text class="label" x="180" y="312" text-anchor="middle">TaskControlBlock T1</text>
  <rect class="box" x="80" y="340" width="92" height="145" rx="6" fill="#fed7aa"/>
  <text class="small" x="126" y="368" text-anchor="middle">KernelStack</text>
  <text class="tiny" x="126" y="392" text-anchor="middle">内核调用链</text>
  <rect class="box context" x="190" y="340" width="90" height="54" rx="6"/>
  <text class="small" x="235" y="372" text-anchor="middle">KContext</text>
  <rect class="box context" x="190" y="420" width="90" height="54" rx="6"/>
  <text class="small" x="235" y="452" text-anchor="middle">TrapFrame</text>
  <path class="gray" d="M180 232V285"/>
  <text class="tiny" x="192" y="263">context switch</text>
  <text class="tiny" x="180" y="505" text-anchor="middle">stackful task context</text>

  <!-- Per-CPU TaskManager -->
  <rect class="panel" x="365" y="82" width="500" height="485" rx="13"/>
  <text class="panel-title" x="615" y="112" text-anchor="middle">TASK_MANAGER[0]（per-CPU run queue）</text>

  <rect class="box rt" x="400" y="135" width="430" height="52" rx="7"/>
  <text class="label" x="420" y="166">realtime_queue</text>
  <text class="tiny" x="810" y="166" text-anchor="end">priority 99 → 1 · FIFO / RR</text>

  <text class="label" x="400" y="215">ready_queues[0..3]：普通任务 MLFQ</text>
  <rect class="box l0" x="400" y="228" width="430" height="44" rx="7"/>
  <text class="label" x="420" y="249">level 0</text><text class="tiny" x="420" y="265">最高 · 2 ticks</text>
  <rect class="box" x="708" y="238" width="42" height="24" rx="4" fill="#bbf7d0"/><text class="tiny" x="729" y="254" text-anchor="middle">T8</text>
  <rect class="box" x="760" y="238" width="42" height="24" rx="4" fill="#bbf7d0"/><text class="tiny" x="781" y="254" text-anchor="middle">T6</text>

  <rect class="box l1" x="400" y="282" width="430" height="44" rx="7"/>
  <text class="label" x="420" y="303">level 1</text><text class="tiny" x="420" y="319">默认 · 4 ticks</text>
  <rect class="box" x="708" y="292" width="42" height="24" rx="4" fill="#d1fae5"/><text class="tiny" x="729" y="308" text-anchor="middle">T3</text>
  <rect class="box" x="760" y="292" width="42" height="24" rx="4" fill="#d1fae5"/><text class="tiny" x="781" y="308" text-anchor="middle">T5</text>

  <rect class="box l2" x="400" y="336" width="430" height="44" rx="7"/>
  <text class="label" x="420" y="357">level 2</text><text class="tiny" x="420" y="373">8 ticks</text>
  <rect class="box" x="734" y="346" width="42" height="24" rx="4" fill="#dcfce7"/><text class="tiny" x="755" y="362" text-anchor="middle">T4</text>

  <rect class="box l3" x="400" y="390" width="430" height="44" rx="7"/>
  <text class="label" x="420" y="411">level 3</text><text class="tiny" x="420" y="427">最低 · 16 ticks</text>
  <rect class="box" x="734" y="400" width="42" height="24" rx="4" fill="#ecfccb"/><text class="tiny" x="755" y="416" text-anchor="middle">T2</text>

  <rect class="note" x="400" y="460" width="430" height="57" rx="7"/>
  <text class="small" x="615" y="483" text-anchor="middle">时间片耗尽 → 降级　｜　阻塞唤醒 → 提升</text>
  <text class="tiny" x="615" y="505" text-anchor="middle">等待 64 次调度选择 → aging 提升</text>

  <path class="blue" d="M400 250C365 240 345 210 300 200"/>
  <text class="tiny" x="349" y="219" text-anchor="middle" fill="#2563eb">fetch</text>

  <!-- Wakeup and enqueue-side CPU selection -->
  <rect class="panel" x="900" y="82" width="350" height="485" rx="13"/>
  <text class="panel-title" x="1075" y="112" text-anchor="middle">唤醒与入队选核</text>

  <rect class="box wait" x="930" y="137" width="290" height="105" rx="8"/>
  <text class="label" x="1075" y="163" text-anchor="middle">等待结构</text>
  <text class="tiny" x="1075" y="187" text-anchor="middle">futex · pipe · socket · epoll · timer …</text>
  <text class="tiny" x="1075" y="216" text-anchor="middle">Blocked / Sleep → wakeup_task() → Ready</text>

  <rect class="box balance" x="930" y="292" width="290" height="86" rx="8"/>
  <text class="label" x="1075" y="323" text-anchor="middle">选择入队 CPU</text>
  <text class="tiny" x="1075" y="351" text-anchor="middle">affinity · last_cpu · load</text>

  <rect class="box other" x="930" y="445" width="290" height="72" rx="8"/>
  <text class="label" x="1075" y="473" text-anchor="middle">TASK_MANAGER[1..N-1]</text>
  <text class="tiny" x="1075" y="497" text-anchor="middle">各 CPU 采用相同的 run queue 结构</text>

  <path class="green" d="M1075 242V292"/>
  <text class="tiny" x="1088" y="270" fill="#15803d">wakeup</text>
  <path class="green" d="M930 335C900 335 880 320 830 320"/>
  <text class="tiny" x="892" y="310" text-anchor="middle" fill="#15803d">enqueue</text>
  <path class="green" d="M1075 378V445"/>
</svg>
